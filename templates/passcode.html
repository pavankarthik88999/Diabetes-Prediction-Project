{% extends "base.html" %}

{% block title %}Enter Passcode - Diabetes Prediction System{% endblock %}
{% block container_class %}narrow{% endblock %}

{% block content %}
<div class="card">
    <h1>Authorized Access</h1>
    <p class="subtitle">Enter the passcode to view the prediction history.</p>

    <form action="{{ url_for('predictions') }}" method="POST">
        <div class="input-group">
            <label for="passcode">Passcode</label>
            <input type="password" id="passcode" name="passcode" required placeholder="Enter passcode">
        </div>
        <button type="submit" class="btn btn-primary">Unlock</button>
    </form>

    <span class="muted-link">
        <a href="{{ url_for('predict') }}">Back to prediction</a>
    </span>
</div>
{% endblock %}
