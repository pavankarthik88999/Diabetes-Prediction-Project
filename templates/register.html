{% extends "base.html" %}

{% block title %}Register - Diabetes Prediction System{% endblock %}
{% block container_class %}narrow{% endblock %}

{% block content %}
<div class="card">
    <h1>Create an Account</h1>
    <p class="subtitle">Register to access the prediction system.</p>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
        </div>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Choose a password">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <span class="muted-link">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </span>
</div>
{% endblock %}
