{% extends "base.html" %}

{% block title %}Login - Diabetes Prediction System{% endblock %}
{% block container_class %}narrow{% endblock %}

{% block content %}
<div class="card">
    <h1>Login</h1>
    <p class="subtitle">Sign in to access the prediction system.</p>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Your username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <span class="muted-link">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </span>
</div>
{% endblock %}
