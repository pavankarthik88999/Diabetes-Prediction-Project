{% extends "base.html" %}

{% block title %}New Prediction - Diabetes Prediction System{% endblock %}

{% block content %}
<div class="card">
    <h1>New Prediction</h1>
    <p class="subtitle">Enter the patient's medical details below to generate a risk assessment.</p>

    <form action="{{ url_for('predict') }}" method="POST" id="predict-form">
        <div class="form-grid">
            <div class="input-group">
                <label for="pregnancies">Pregnancies</label>
                <input type="number" step="any" min="0" id="pregnancies" name="pregnancies" required placeholder="e.g. 1">
            </div>
            <div class="input-group">
                <label for="glucose">Glucose Level (mg/dL)</label>
                <input type="number" step="any" min="0" id="glucose" name="glucose" required placeholder="e.g. 85">
            </div>
            <div class="input-group">
                <label for="bloodPressure">Blood Pressure (mm Hg)</label>
                <input type="number" step="any" min="0" id="bloodPressure" name="bloodPressure" required placeholder="e.g. 66">
            </div>
            <div class="input-group">
                <label for="skinThickness">Skin Thickness (mm)</label>
                <input type="number" step="any" min="0" id="skinThickness" name="skinThickness" required placeholder="e.g. 29">
            </div>
            <div class="input-group">
                <label for="insulin">Insulin (mu U/ml)</label>
                <input type="number" step="any" min="0" id="insulin" name="insulin" required placeholder="e.g. 0">
            </div>
            <div class="input-group">
                <label for="bmi">BMI</label>
                <input type="number" step="0.1" min="0" id="bmi" name="bmi" required placeholder="e.g. 26.6">
            </div>
            <div class="input-group">
                <label for="dpf">Diabetes Pedigree Function</label>
                <input type="number" step="0.001" min="0" id="dpf" name="dpf" required placeholder="e.g. 0.351">
            </div>
            <div class="input-group">
                <label for="age">Age</label>
                <input type="number" step="any" min="0" id="age" name="age" required placeholder="e.g. 31">
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Run Prediction</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Prevent duplicate submissions (double-click / browser re-send)
    const form = document.getElementById('predict-form');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', function () {
        btn.disabled = true;
        btn.textContent = 'Analysing...';
    });
</script>
{% endblock %}
